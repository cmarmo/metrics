$id: https://quantstack.net/schema/metrics/runtime-error/v1
version: "1"
title: runtime error metrics emission
description: |
  a runtime error event metrics emission
type: object
properties:
  level:
    type: object
    properties:
      sensitivity:
        type: string
        enum:
          - high
          - moderate
          - low
        default: high
      anonymous:
        type: boolean
        default: false
  metrics:
    type: object
    properties:
      type:
        type: string
      description:
        type: string
  timestamp:
    type: string
required:
  - level
  - metrics
  - timestamp
