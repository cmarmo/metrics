$id: https://quantstack.net/schema/metrics/current-changed/v1
version: 1
title: current changed metrics emission
description: |
  a current activity changed metrics emission
type: object
properties:
  level:
    type: object
    properties:
      sensitivity:
        type: string
        enum:
          - high
          - moderate
          - low
      anonymous:
        type: boolean
        default: false
  metrics:
    type: object
    properties:
      label:
        type: string
  timestamp:
    type: string
required:
  - level
  - metrics
  - timestamp
