$id: https://quantstack.net/schema/metrics/command-executed/v1
version: 1
title: command executed metrics emission
description: |
  a command execution metrics emission
type: object
properties:
  level:
    type: object
    properties:
      sensitivity:
        type: string
        enum:
          - high
          - moderate
          - low
        default: high
      anonymous:
        type: boolean
        default: false
      required:
        - anonymous
        - sensitivity
  metrics:
    type: object
    properties:
      command:
        type: string
      args:
        type: object
        additionalProperties: true
      label:
        optional: true
        type: string
    required:
      - command
  timestamp:
    type: string
required:
  - level
  - metrics
  - timestamp
